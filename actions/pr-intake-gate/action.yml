name: PR Intake Gate
description: Deterministic PR intake gate for external contributors.

inputs:
  policy-path:
    description: Path to the repository-local PR intake policy.
    required: false
    default: .github/pr-intake-gate.yml
  github-token:
    description: GitHub token used to read PR metadata and update labels/comments.
    required: false
    default: ''
  dry-run:
    description: Run without writing labels or comments.
    required: false
    default: 'false'
  codex-review-gate:
    description: Run the read-only Codex Review Gate after PR intake.
    required: false
    default: 'true'
  codex-review-author-logins:
    description: Comma-separated GitHub logins whose unresolved review threads should block.
    required: false
    default: 'chatgpt-codex-connector'
  codex-review-ignore-outdated:
    description: Whether to ignore outdated Codex Review threads.
    required: false
    default: 'true'
  codex-review-require-current-review:
    description: Require a Codex Review result for the current pull request head before passing.
    required: false
    default: 'false'
  codex-review-wait-seconds:
    description: Seconds to wait for the current Codex Review result before failing.
    required: false
    default: '0'
  codex-review-resolution-wait-seconds:
    description: Seconds to wait for unresolved Codex Review threads to clear before failing.
    required: false
    default: '0'
  codex-review-poll-interval-seconds:
    description: Seconds between polling attempts while waiting for the current Codex Review result or thread resolution.
    required: false
    default: '10'

runs:
  using: composite
  steps:
    - name: Run PR intake gate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_INTAKE_GATE_DRY_RUN: ${{ inputs.dry-run }}
        CODEX_REVIEW_GATE_ENABLED: ${{ inputs.codex-review-gate }}
        CODEX_REVIEW_GATE_AUTHOR_LOGINS: ${{ inputs.codex-review-author-logins }}
        CODEX_REVIEW_GATE_IGNORE_OUTDATED: ${{ inputs.codex-review-ignore-outdated }}
        CODEX_REVIEW_GATE_REQUIRE_CURRENT_REVIEW: ${{ inputs.codex-review-require-current-review }}
        CODEX_REVIEW_GATE_WAIT_SECONDS: ${{ inputs.codex-review-wait-seconds }}
        CODEX_REVIEW_GATE_RESOLUTION_WAIT_SECONDS: ${{ inputs.codex-review-resolution-wait-seconds }}
        CODEX_REVIEW_GATE_POLL_INTERVAL_SECONDS: ${{ inputs.codex-review-poll-interval-seconds }}
      run: |
        set +e
        python3 "$GITHUB_ACTION_PATH/pr_intake_gate.py" --policy "${{ inputs.policy-path }}"
        intake_status=$?

        codex_status=0
        effective_require_current_review="${CODEX_REVIEW_GATE_REQUIRE_CURRENT_REVIEW}"
        if [ "$intake_status" -ne 0 ]; then
          effective_require_current_review=false
        fi

        case "${CODEX_REVIEW_GATE_ENABLED}" in
          1|true|TRUE|yes|YES|on|ON)
            python3 "$GITHUB_ACTION_PATH/../codex-review-gate/codex_review_gate.py" \
              --review-author-logins "${CODEX_REVIEW_GATE_AUTHOR_LOGINS}" \
              --ignore-outdated "${CODEX_REVIEW_GATE_IGNORE_OUTDATED}" \
              --require-current-review "${effective_require_current_review}" \
              --wait-seconds "${CODEX_REVIEW_GATE_WAIT_SECONDS}" \
              --resolution-wait-seconds "${CODEX_REVIEW_GATE_RESOLUTION_WAIT_SECONDS}" \
              --poll-interval-seconds "${CODEX_REVIEW_GATE_POLL_INTERVAL_SECONDS}"
            codex_status=$?
            ;;
          *)
            echo "Codex Review Gate disabled for this PR Intake Gate run."
            ;;
        esac

        if [ "$intake_status" -ne 0 ]; then
          exit "$intake_status"
        fi
        exit "$codex_status"

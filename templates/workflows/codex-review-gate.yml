name: Codex Review Gate

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  pull_request_review_comment:
    types:
      - created
      - edited
      - deleted

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  codex-review-gate:
    name: codex-review-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check Codex review threads
        # Replace with a protected tag or exact commit SHA that includes
        # require-current-review, wait-seconds, and poll-interval-seconds.
        uses: heurema/repo-governance/actions/codex-review-gate@<commit-sha-with-current-review-gate>
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          review-author-logins: chatgpt-codex-connector
          ignore-outdated: 'true'
          require-current-review: 'true'
          wait-seconds: '240'
          poll-interval-seconds: '15'
